name: host-tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset host-debug

      - name: Build
        run: cmake --build --preset host-debug --parallel

      - name: Test
        run: ctest --preset host-debug --output-on-failure
